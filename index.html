<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A101C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הכסף שלנו">
<title>הכסף שלנו</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<section class="gate" id="setup" hidden></section>

<section class="gate" id="lock" hidden>
  <svg id="lockRos" aria-hidden="true"></svg>
  <h2>הכסף שלנו</h2>
  <p class="lead">הנתונים מוצפנים. מזינים סיסמה כדי לפתוח.</p>
  <form id="lockForm" class="stack" autocomplete="off">
    <input class="in center" type="password" id="pw" placeholder="סיסמה" aria-label="סיסמה" autocomplete="current-password">
    <button class="btn" type="submit" id="unlockBtn">פתיחה</button>
    <p class="err" id="lockErr" role="alert"></p>
  </form>
  <p class="small">ננעל לבד אחרי 5 דקות בלי שימוש.</p>
  <button class="linkbtn" type="button" id="reconnect" data-act="reconnect" hidden>חיבור מחדש של המכשיר</button>
</section>

<div id="app" hidden>
  <div class="app">
    <header class="top">
      <svg class="mark" id="mark" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" aria-hidden="true"></svg>
      <div class="id"><h1>הכסף שלנו</h1><div class="status" id="status"></div></div>
      <button class="ibtn" id="privBtn" type="button" data-act="privacy" aria-label="הסתרת סכומים"></button>
      <button class="ibtn" type="button" data-act="settings" aria-label="הגדרות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <main>
      <section class="view" id="v-overview"></section>
      <section class="view" id="v-accounts" hidden></section>
      <section class="view" id="v-kids" hidden></section>
      <section class="view" id="v-fees" hidden></section>
      <section class="view" id="v-update" hidden></section>
    </main>
  </div>

  <div class="float" id="float" role="status" hidden></div>

  <nav class="tabs" role="tablist" aria-label="תפריט">
    <button role="tab" type="button" data-tab="overview" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/></svg>סקירה</button>
    <button role="tab" type="button" data-tab="accounts" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M7 3h10"/></svg>חשבונות</button>
    <button role="tab" type="button" data-tab="kids" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6.5" r="2.8"/><path d="M6.5 21v-4a5.5 5.5 0 0 1 11 0v4"/></svg>ילדים</button>
    <button role="tab" type="button" data-tab="fees" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>דמי ניהול</button>
    <button role="tab" type="button" data-tab="update" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>עריכה</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="פרטים"></aside>
<div class="toast" id="toast" role="status"></div>
<noscript><p class="small" style="padding:24px">האפליקציה צריכה JavaScript כדי לעבוד.</p></noscript>
</body>
</html>
